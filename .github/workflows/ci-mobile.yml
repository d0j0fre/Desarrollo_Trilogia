name: CI Mobile

# Separado del pipeline de .NET a proposito: un fallo de Flutter no debe
# bloquear el build del backend, ni al reves.
on:
  push:
    branches: [main]
    tags: ['movil-v*']
    paths:
      - 'Trilogia-Cursos/Proyecto_Movil/**'
      - '.github/workflows/ci-mobile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Trilogia-Cursos/Proyecto_Movil/**'
      - '.github/workflows/ci-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: Trilogia-Cursos/Proyecto_Movil

env:
  FLUTTER_VERSION: '3.38.1'

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Restore packages
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --fatal-infos

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Restore packages
        run: flutter pub get
      - name: Unit tests
        run: flutter test --coverage

  build-apk:
    name: build-apk
    # Solo en tags. Compilar un APK en cada commit gasta minutos de runner sin
    # que nadie lo instale.
    if: startsWith(github.ref, 'refs/tags/movil-v')
    needs: [analyze, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore packages
        run: flutter pub get

      # El keystore llega como secreto en base64 y se materializa solo dentro
      # del runner. Nunca toca el repositorio.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64. Un APK firmado con la clave de depuración no se distribuye."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::Falta la variable API_BASE_URL. Sin ella el APK apuntaría a la dirección de desarrollo."
            exit 1
          fi
          # split-per-abi reduce el APK de ~50 MB a ~20 MB por arquitectura.
          # Con distribución por QR, eso son 30 MB menos de datos móviles por
          # cada instalación.
          flutter build apk --release --split-per-abi \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      # El SHA-256 se publica junto al enlace de descarga: es la unica forma de
      # que quien instala verifique que el archivo es el que el equipo publico.
      - name: Compute checksums
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum *.apk | tee checksums.txt

      - name: Publish build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.ref_name }}
          path: |
            Trilogia-Cursos/Proyecto_Movil/build/app/outputs/flutter-apk/*.apk
            Trilogia-Cursos/Proyecto_Movil/build/app/outputs/flutter-apk/checksums.txt
          retention-days: 90

      - name: Remove keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
